server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes (HikariCP) - limite baixo para nao estourar
# as conexoes disponiveis no PostgreSQL do Aiven
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Configuracoes de Seguranca e JWT
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-millis=86400000

# Seed do usuario administrador (opcional)
admin.email=${ADMIN_EMAIL:admin@sistema.com}
admin.password=${ADMIN_PASSWORD:}
